<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Self-hosted GitHub Actions runners: isolate CI machines</title>
  <desc id="desc">Block public fork PRs, isolate runner groups, and use ephemeral hosts.</desc>
  <rect width="1200" height="630" fill="#102129"/>
  <rect x="68" y="68" width="1064" height="494" rx="8" fill="#ffffff"/>
  <rect x="68" y="68" width="10" height="494" fill="#b9322b"/>
  <text x="108" y="142" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#b9322b">CI Tripwire  |  GitHub Actions</text>
  <text x="108" y="246" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#172026">Self-hosted GitHub Actions runners:</text>
  <text x="108" y="320" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#172026">isolate CI machines</text>
  <text x="108" y="514" font-family="Arial, sans-serif" font-size="29" fill="#52616b">Block public fork PRs, isolate runner groups, and use ephemeral hosts.</text>
</svg>
